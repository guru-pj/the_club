server:
  port: 8761

spring:
  jackson:
    # Spring Boot 4 uses Jackson 3, whose defaults differ (e.g. missing primitive fields are rejected); keep the
    # behaviour clients relied on with Jackson 2
    use-jackson2-defaults: true
  application:
    name: discovery-service

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # single-node registry; avoid self-preservation noise in development
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:false}
    # Serve registry changes within 5s (default 30s) so restarted services are routable quickly
    response-cache-update-interval-ms: 5000

management:
  endpoints:
    web:
      exposure:
        # /actuator is never reachable from outside: nginx proxies only /api and the gateway never routes /actuator.
        # Prometheus scrapes /actuator/prometheus over the internal network.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # /actuator/health/liveness and /actuator/health/readiness for Docker and Kubernetes probes
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s

# --- Operations: graceful shutdown on SIGTERM (rolling deploys), connection pool, outbound timeouts ---
# Logs are plain text locally; set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON (the observability stack does).
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
