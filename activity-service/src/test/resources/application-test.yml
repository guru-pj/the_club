spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      # Flyway builds the schema; validate proves the migrations match the entities on every test run
      ddl-auto: validate

eureka:
  client:
    enabled: false

theclub:
  jwt:
    private-key: classpath:jwt-test-private.pem
    public-key: classpath:jwt-test-public.pem
  security:
    internal-api-key: test-internal-key
  strava:
    client-id: "12345"
    client-secret: test-client-secret
    webhook-verify-token: test-verify-token
    # base64 of 32 bytes, test-only
    token-encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    # tests call StravaWebhookWorker.runOnce() directly
    worker-enabled: false
