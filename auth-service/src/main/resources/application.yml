server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Databases created earlier by Hibernate's ddl-auto=update have no Flyway history table. They are adopted
    # as version 1 (the baseline) without re-running V1__baseline.sql; later migrations then apply normally.
    baseline-on-migrate: true
    baseline-version: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    # See newly started services within seconds instead of ~30s (avoids 503s right after a restart)
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

# The load balancer's own instance cache would otherwise add another 35s of delay
spring.cloud.loadbalancer.cache.ttl: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info

theclub:
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    previous-public-key: ${JWT_PREVIOUS_PUBLIC_KEY:}
    key-id: ${JWT_KEY_ID:k1}
    expiration: ${JWT_EXPIRATION:PT15M}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:P14D}
  security:
    internal-api-key: ${INTERNAL_API_KEY}
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /api/v1/auth/.well-known/jwks.json
  auth:
    # Secure cookies need HTTPS; set AUTH_COOKIE_SECURE=false only for plain-HTTP local development
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    require-verified-email: ${REQUIRE_EMAIL_VERIFICATION:true}
    lockout:
      max-attempts: ${LOGIN_LOCKOUT_MAX_ATTEMPTS:5}
      window: ${LOGIN_LOCKOUT_WINDOW:PT15M}
      duration: ${LOGIN_LOCKOUT_DURATION:PT15M}
  clients:
    user-service:
      url: ${USER_SERVICE_URL:}
