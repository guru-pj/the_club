# ============================================================
# The Club — observability stack: metrics (Prometheus + Alertmanager), traces (OpenTelemetry Collector → Tempo),
# logs (Grafana Alloy → Loki) and dashboards (Grafana). Add it on top of the normal files:
#
#   Development: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.observability.yml up -d
#   Production:  docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# It also switches the Spring services to JSON logs and turns on trace export. Without this file the
# application runs exactly as before (plain-text logs, no trace export). UIs are bound to localhost only:
#   Grafana      http://localhost:${GRAFANA_PORT:-3001}   (user admin, password in secrets/grafana-admin-password)
#   Prometheus   http://localhost:${PROMETHEUS_PORT:-9090}
#   Alertmanager http://localhost:${ALERTMANAGER_PORT:-9093}
# See docs/OBSERVABILITY.md.
# ============================================================

x-observed-service: &observed-env
  # export spans to the collector; JSON (ECS) logs with traceId/spanId/requestId for Loki
  TRACING_ENABLED: "true"
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

x-obs-logging: &obs-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- application services: same containers, observability switched on
  gateway-service:
    environment: *observed-env
  user-service:
    environment: *observed-env
  auth-service:
    environment: *observed-env
  activity-service:
    environment: *observed-env
  club-service:
    environment: *observed-env
  event-service:
    environment: *observed-env
  notification-service:
    environment: *observed-env
  discovery-service:
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  config-service:
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

  # ---------- traces
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *obs-logging

  tempo:
    image: grafana/tempo:3.1.1
    container_name: tempo
    restart: unless-stopped
    # the image runs as uid 10001; let it own its data volume
    user: "10001"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *obs-logging

  # ---------- metrics & alerts
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *obs-logging

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    restart: unless-stopped
    # Builds the receivers from the application's mail settings, then starts Alertmanager with the arguments below
    entrypoint: ["/bin/sh", "/etc/alertmanager/render-config.sh"]
    command:
      - --storage.path=/alertmanager
    environment:
      APP_PROFILE: ${SPRING_PROFILES_ACTIVE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_STARTTLS: ${MAIL_STARTTLS}
      ZEPTOMAIL_API_URL: ${ZEPTOMAIL_API_URL:-https://api.zeptomail.in/v1.1/email}
      # Optional overrides: who gets alerts (default ADMIN_EMAIL) and the sender (default MAIL_FROM)
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SLACK_CHANNEL: ${ALERT_SLACK_CHANNEL:-}
      # "none" lets Alertmanager start under the prod profile without any receiver
      ALERT_DELIVERY: ${ALERT_DELIVERY:-}
    secrets:
      - zeptomail-token
      - smtp-password
      - alertmanager-slack-webhook
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./observability/alertmanager/render-config.sh:/etc/alertmanager/render-config.sh:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *obs-logging

  # ---------- logs
  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *obs-logging

  alloy:
    image: grafana/alloy:v1.21.0
    container_name: alloy
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # read-only: Alloy only lists containers and reads their logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *obs-logging

  # ---------- dashboards
  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: warn
    secrets:
      - grafana-admin-password
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *obs-logging

secrets:
  grafana-admin-password:
    file: ./secrets/grafana-admin-password
  # Slack incoming-webhook URL for alerts; created empty by scripts/generate-secrets.sh (empty = no Slack)
  alertmanager-slack-webhook:
    file: ./secrets/alertmanager-slack-webhook

volumes:
  tempo_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  alloy_data:
  grafana_data:
