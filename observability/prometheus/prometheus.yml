# Prometheus for The Club. Scrapes every Spring service's /actuator/prometheus over the internal compose network
# (never through nginx/the gateway) plus the observability components themselves.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: the-club

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: theclub-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway-service:8080
          - user-service:8081
          - auth-service:8082
          - activity-service:8083
          - club-service:8084
          - event-service:8086
          - notification-service:8087
          - discovery-service:8761
          - config-service:8888
    relabel_configs:
      # service="user-service" (the compose service name, same as spring.application.name)
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service

  - job_name: observability
    static_configs:
      - targets: ["prometheus:9090", "alertmanager:9093", "otel-collector:8888", "tempo:3200", "loki:3100"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
