# Alertmanager routing. The "default" receiver has no integration yet, so alerts are visible in the
# Alertmanager UI (and Grafana) but not sent anywhere. Add one of the examples below for production
# (see docs/OBSERVABILITY.md, "Alert delivery").
route:
  receiver: default
  group_by: [alertname, application, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # email_configs:
    #   - to: ops@yourdomain.com
    #     from: alerts@yourdomain.com
    #     smarthost: smtp.zeptomail.in:587
    #     auth_username: emailapikey
    #     auth_password_file: /run/secrets/alertmanager-smtp-password
    #     send_resolved: true
    # slack_configs:
    #   - api_url_file: /run/secrets/alertmanager-slack-webhook
    #     channel: "#the-club-alerts"
    #     send_resolved: true

inhibit_rules:
  # a down service also fails its error-rate/latency rules; only page once
  - source_matchers: [alertname="ServiceDown"]
    target_matchers: [alertname=~"HighErrorRate|HighLatencyP95"]
    equal: [service]
