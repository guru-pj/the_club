# Alertmanager routing. The "receivers" section is appended at container start by render-config.sh from the
# application's mail settings (Mailpit in development, ZeptoMail or SMTP in production) plus an optional Slack
# webhook. See docs/OBSERVABILITY.md, "Alert delivery".
route:
  receiver: default
  group_by: [alertname, application, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

inhibit_rules:
  # a down service also fails its error-rate/latency rules; only page once
  - source_matchers: [alertname="ServiceDown"]
    target_matchers: [alertname=~"HighErrorRate|HighLatencyP95"]
    equal: [service]
