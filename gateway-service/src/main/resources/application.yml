server:
  port: 8080

spring:
  jackson:
    # Spring Boot 4 uses Jackson 3, whose defaults differ (e.g. missing primitive fields are rejected); keep the
    # behaviour clients relied on with Jackson 2
    use-jackson2-defaults: true
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # Per-route latency/status metrics: spring_cloud_gateway_requests_seconds{routeId,httpStatusCode,...}
          metrics:
            enabled: true
          # Only the routes below are exposed; the discovery locator stays off so /internal/** is never reachable.
          discovery:
            locator:
              enabled: false
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://localhost,capacitor://localhost,tauri://localhost}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                # the refresh token travels in an httpOnly cookie (browsers); the native apps send it in the body
                allow-credentials: true
                max-age: 3600
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/v1/users/**
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:lb://auth-service}
              predicates:
                - Path=/api/v1/auth/**
            - id: activity-service
              uri: ${ACTIVITY_SERVICE_URI:lb://activity-service}
              predicates:
                - Path=/api/v1/activities/**,/api/v1/strava/**
            - id: club-service
              uri: ${CLUB_SERVICE_URI:lb://club-service}
              predicates:
                - Path=/api/v1/clubs/**,/api/v1/owner-verification/**
            - id: event-service
              uri: ${EVENT_SERVICE_URI:lb://event-service}
              predicates:
                - Path=/api/v1/events/**,/api/v1/payments/**,/api/v1/participation/**,/api/v1/leaderboards/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
              predicates:
                - Path=/api/v1/notifications/**

theclub:
  gateway:
    # true only behind a trusted reverse proxy (nginx in the web-app container sets X-Real-IP / X-Forwarded-For)
    trust-forwarded-for: ${GATEWAY_TRUST_FORWARDED_FOR:false}
    max-body-bytes: ${GATEWAY_MAX_BODY_BYTES:1048576}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      # login, register, password reset, email verification (POST); token refresh only uses the general bucket
      strict:
        capacity: ${RATE_LIMIT_STRICT_PER_MINUTE:10}
        period: PT1M
      general:
        capacity: ${RATE_LIMIT_GENERAL_PER_MINUTE:300}
        period: PT1M

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    # See newly started services within seconds instead of ~30s (avoids 503s right after a restart)
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

# The load balancer's own instance cache would otherwise add another 35s of delay
spring.cloud.loadbalancer.cache.ttl: 5s

management:
  endpoints:
    web:
      exposure:
        # /actuator is never reachable from outside: nginx proxies only /api and the gateway never routes /actuator.
        # Prometheus scrapes /actuator/prometheus over the internal network.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # /actuator/health/liveness and /actuator/health/readiness for Docker and Kubernetes probes
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        # per-route upstream latency histogram (Gateway dashboard)
        spring.cloud.gateway.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s
  tracing:
    # Spans are exported only where an OpenTelemetry collector runs (docker-compose.observability.yml, Helm chart)
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# --- Operations: graceful shutdown on SIGTERM (rolling deploys), connection pool, outbound timeouts ---
# Logs are plain text locally; set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON (the observability stack does).
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
