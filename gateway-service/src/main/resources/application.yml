server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # Only the routes below are exposed; the discovery locator stays off so /internal/** is never reachable.
          discovery:
            locator:
              enabled: false
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                # the refresh token travels in an httpOnly cookie
                allow-credentials: true
                max-age: 3600
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/v1/users/**
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:lb://auth-service}
              predicates:
                - Path=/api/v1/auth/**
            - id: activity-service
              uri: ${ACTIVITY_SERVICE_URI:lb://activity-service}
              predicates:
                - Path=/api/v1/activities/**,/api/v1/strava/**
            - id: club-service
              uri: ${CLUB_SERVICE_URI:lb://club-service}
              predicates:
                - Path=/api/v1/clubs/**,/api/v1/owner-verification/**
            - id: event-service
              uri: ${EVENT_SERVICE_URI:lb://event-service}
              predicates:
                - Path=/api/v1/events/**,/api/v1/payments/**,/api/v1/participation/**,/api/v1/leaderboards/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
              predicates:
                - Path=/api/v1/notifications/**

theclub:
  gateway:
    # true only behind a trusted reverse proxy (nginx in the web-app container sets X-Real-IP / X-Forwarded-For)
    trust-forwarded-for: ${GATEWAY_TRUST_FORWARDED_FOR:false}
    max-body-bytes: ${GATEWAY_MAX_BODY_BYTES:1048576}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      # login, register, password reset, email verification (POST); token refresh only uses the general bucket
      strict:
        capacity: ${RATE_LIMIT_STRICT_PER_MINUTE:10}
        period: PT1M
      general:
        capacity: ${RATE_LIMIT_GENERAL_PER_MINUTE:300}
        period: PT1M

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    # See newly started services within seconds instead of ~30s (avoids 503s right after a restart)
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

# The load balancer's own instance cache would otherwise add another 35s of delay
spring.cloud.loadbalancer.cache.ttl: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
