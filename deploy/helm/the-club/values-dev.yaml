# Local development on kind (deploy/kind/up.sh): locally built images, in-cluster databases and mail catcher,
# mock payments, no TLS. NOT for production.
global:
  imageRegistry: theclub.local
  imageTag: dev
  imagePullPolicy: Never            # images are loaded into the kind nodes, never pulled

config:
  springProfilesActive: dev
  appBaseUrl: http://localhost:8088
  corsAllowedOrigins: http://localhost:8088
  auth:
    cookieSecure: false             # plain HTTP on localhost
    requireEmailVerification: false
  payments:
    provider: mock
  mail:
    provider: smtp                  # to the in-cluster Mailpit
    smtp:
      port: 1025
      starttls: false
  strava:
    redirectUri: http://localhost:8088/strava/callback
    webhookVerifyToken: dev-strava-verify-token
  gateway:
    # smoke and browser tests log in many times from one IP
    rateLimitStrictPerMinute: 200

databases:
  embedded:
    enabled: true
    mysql:
      storage: 2Gi
    postgres:
      storage: 1Gi

backups:
  enabled: true
  storage: 1Gi

mailpit:
  enabled: true

serviceDefaults:
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 640Mi}

networkPolicy:
  # deploy/kind/up.sh installs Traefik into this namespace
  ingressControllerNamespace: traefik

observability:
  logFormat: text
