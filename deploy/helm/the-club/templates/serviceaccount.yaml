{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "theclub.serviceAccountName" . }}
  labels:
    {{- include "theclub.labels" (dict "root" $ "component" "serviceaccount") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The services never call the Kubernetes API
automountServiceAccountToken: false
{{- end }}
