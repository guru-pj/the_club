{{- if and .Values.webApp.enabled .Values.httpRoute.enabled }}
# Gateway API alternative to the Ingress (requires the gateway.networking.k8s.io CRDs and a Gateway)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "theclub.fullname" . }}
  labels:
    {{- include "theclub.labels" (dict "root" $ "component" "web") | nindent 4 }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs is required when httpRoute.enabled" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "theclub.serviceName" (dict "root" $ "component" "web") }}
          port: 80
{{- end }}
