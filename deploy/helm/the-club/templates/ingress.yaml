{{- if and .Values.webApp.enabled .Values.ingress.enabled }}
{{- $i := .Values.ingress -}}
# Only the web app is exposed: it serves the SPA and proxies /api to the gateway (same origin, no CORS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "theclub.fullname" . }}
  labels:
    {{- include "theclub.labels" (dict "root" $ "component" "web") | nindent 4 }}
  {{- with $i.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $i.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $i.tls.enabled }}
  tls:
    - secretName: {{ $i.tls.secretName }}
      {{- with $i.host }}
      hosts:
        - {{ . | quote }}
      {{- end }}
  {{- end }}
  rules:
    - {{- with $i.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "theclub.serviceName" (dict "root" $ "component" "web") }}
                port:
                  name: http
{{- end }}
