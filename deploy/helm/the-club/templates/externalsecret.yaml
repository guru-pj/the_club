{{- if .Values.secrets.external.enabled }}
{{- $x := .Values.secrets.external -}}
# The Secret every service mounts, built and kept in sync by the External Secrets Operator from a cloud secret
# manager. Rotating a value there updates the Secret within refreshInterval; restart the services to pick it up
# (kubectl rollout restart deploy -l app.kubernetes.io/instance={{ .Release.Name }}).
apiVersion: {{ $x.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "theclub.secretName" . }}
  labels:
    {{- include "theclub.labels" (dict "root" $ "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $x.refreshInterval }}
  secretStoreRef:
    name: {{ required "secrets.external.secretStoreRef.name is required" $x.secretStoreRef.name }}
    kind: {{ $x.secretStoreRef.kind }}
  target:
    name: {{ include "theclub.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $x.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $x.remotePrefix }}{{ . | replace "." "-" }}
    {{- end }}
    {{- range $x.extraKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $x.remotePrefix }}{{ . | replace "." "-" }}
    {{- end }}
{{- end }}
