{{- if .Values.secrets.create }}
# Development only: values passed to Helm are stored in the release history. Production uses an existing Secret
# (kubectl create secret generic --from-file=secrets/, External Secrets Operator, Sealed Secrets, ...).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "theclub.secretName" . }}
  labels:
    {{- include "theclub.labels" (dict "root" $ "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
