server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/userdb?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Databases created earlier by Hibernate's ddl-auto=update have no Flyway history table. They are adopted
    # as version 1 (the baseline) without re-running V1__baseline.sql; later migrations then apply normally.
    baseline-on-migrate: true
    baseline-version: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

theclub:
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
    previous-public-key: ${JWT_PREVIOUS_PUBLIC_KEY:}
    key-id: ${JWT_KEY_ID:k1}
    expiration: ${JWT_EXPIRATION:PT15M}
  security:
    internal-api-key: ${INTERNAL_API_KEY}
    public-paths:
      - /api/v1/users/register
      - /api/v1/users/verify-email
      - /api/v1/users/verify-email/resend
      - /api/v1/users/password-reset/request
      - /api/v1/users/password-reset/confirm
  app:
    # public URL of the web app, used for links in verification and password reset emails
    base-url: ${APP_BASE_URL:http://localhost:3000}
  clients:
    notification-service:
      url: ${NOTIFICATION_SERVICE_URL:}
    auth-service:
      url: ${AUTH_SERVICE_URL:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
