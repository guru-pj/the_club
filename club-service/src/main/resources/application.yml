server:
  port: 8084

spring:
  servlet:
    multipart:
      # Above theclub.media.max-size, so oversized images get the app's own message instead of a generic error
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    # Spring Boot 4 uses Jackson 3, whose defaults differ (e.g. missing primitive fields are rejected); keep the
    # behaviour clients relied on with Jackson 2
    use-jackson2-defaults: true
  application:
    name: club-service
  # Only used with CHAT_FANOUT=redis: a managed Redis (ElastiCache, Memorystore, Azure Cache for Redis) or the chart's
  # own. The password comes from the redis-password secret.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clubdb?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Databases created earlier by Hibernate's ddl-auto=update have no Flyway history table. They are adopted
    # as version 1 (the baseline) without re-running V1__baseline.sql; later migrations then apply normally.
    baseline-on-migrate: true
    baseline-version: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    # See newly started services within seconds instead of ~30s (avoids 503s right after a restart)
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

# The load balancer's own instance cache would otherwise add another 35s of delay
spring.cloud.loadbalancer.cache.ttl: 5s

management:
  # Redis is optional (CHAT_FANOUT=redis); only then may its state affect /actuator/health
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        # /actuator is never reachable from outside: nginx proxies only /api and the gateway never routes /actuator.
        # Prometheus scrapes /actuator/prometheus over the internal network.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # /actuator/health/liveness and /actuator/health/readiness for Docker and Kubernetes probes
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s
  tracing:
    # Spans are exported only where an OpenTelemetry collector runs (docker-compose.observability.yml, Helm chart)
    export:
      enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  # Spring Boot 4 names (management.tracing.enabled / management.otlp.tracing.endpoint are no longer read)
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

theclub:
  # Uploads (profile pictures, club photos, event images, private documents) go to object storage: S3-compatible
  # (SeaweedFS in Docker Compose, AWS S3, Cloudflare R2), Google Cloud Storage or Azure Blob Storage. Off until a
  # bucket is set. Empty keys mean the cloud's own identity (EKS IRSA / Pod Identity, GKE Workload Identity, AKS
  # workload identity). Secrets come from the media-s3-secret-key / media-azure-connection-string secrets.
  media:
    provider: ${MEDIA_PROVIDER:s3}
    endpoint: ${MEDIA_S3_ENDPOINT:}
    region: ${MEDIA_S3_REGION:us-east-1}
    bucket: ${MEDIA_S3_BUCKET:}
    private-bucket: ${MEDIA_PRIVATE_BUCKET:}
    access-key: ${MEDIA_S3_ACCESS_KEY:}
    secret-key: ${MEDIA_S3_SECRET_KEY:}
    azure-connection-string: ${MEDIA_AZURE_CONNECTION_STRING:}
    gcs-project-id: ${MEDIA_GCS_PROJECT_ID:}
    path-style: ${MEDIA_S3_PATH_STYLE:true}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:/media}
    max-size: ${MEDIA_MAX_SIZE:5MB}
  chat:
    # database: each replica checks the database for messages written on the others (every CHAT_RELAY_INTERVAL);
    # redis: replicas pass messages to each other through Redis at once, and the database check is only a safety net
    fanout: ${CHAT_FANOUT:database}
    relay-interval: ${CHAT_RELAY_INTERVAL:PT2S}
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
    previous-public-key: ${JWT_PREVIOUS_PUBLIC_KEY:}
    key-id: ${JWT_KEY_ID:k1}
    expiration: ${JWT_EXPIRATION:PT15M}
  security:
    internal-api-key: ${INTERNAL_API_KEY}
    public-paths:
      # what a shared post link shows before signing in
      - /api/v1/clubs/*/posts/*/preview
  clients:
    user-service:
      url: ${USER_SERVICE_URL:}
    activity-service:
      url: ${ACTIVITY_SERVICE_URL:}
    event-service:
      url: ${EVENT_SERVICE_URL:}
    notification-service:
      url: ${NOTIFICATION_SERVICE_URL:}

# --- Operations: graceful shutdown on SIGTERM (rolling deploys), connection pool, outbound timeouts ---
# Logs are plain text locally; set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON (the observability stack does).
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
spring.datasource.hikari.maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout: 5000
spring.cloud.openfeign.client.config.default.connect-timeout: 3000
spring.cloud.openfeign.client.config.default.read-timeout: 10000
