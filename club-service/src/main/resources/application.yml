server:
  port: 8084

spring:
  application:
    name: club-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clubdb?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

theclub:
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT1H}
  security:
    internal-api-key: ${INTERNAL_API_KEY}
  clients:
    user-service:
      url: ${USER_SERVICE_URL:}
    activity-service:
      url: ${ACTIVITY_SERVICE_URL:}
    event-service:
      url: ${EVENT_SERVICE_URL:}
    notification-service:
      url: ${NOTIFICATION_SERVICE_URL:}
