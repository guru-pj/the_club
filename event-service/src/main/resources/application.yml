server:
  port: 8086

spring:
  application:
    name: event-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eventdb?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Databases created earlier by Hibernate's ddl-auto=update have no Flyway history table. They are adopted
    # as version 1 (the baseline) without re-running V1__baseline.sql; later migrations then apply normally.
    baseline-on-migrate: true
    baseline-version: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    # See newly started services within seconds instead of ~30s (avoids 503s right after a restart)
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

# The load balancer's own instance cache would otherwise add another 35s of delay
spring.cloud.loadbalancer.cache.ttl: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info

theclub:
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
    previous-public-key: ${JWT_PREVIOUS_PUBLIC_KEY:}
    key-id: ${JWT_KEY_ID:k1}
    expiration: ${JWT_EXPIRATION:PT15M}
  security:
    internal-api-key: ${INTERNAL_API_KEY}
    public-paths:
      # authenticated by the provider's HMAC signature instead of a JWT
      - /api/v1/payments/webhooks/**
  clients:
    club-service:
      url: ${CLUB_SERVICE_URL:}
    user-service:
      url: ${USER_SERVICE_URL:}
    notification-service:
      url: ${NOTIFICATION_SERVICE_URL:}
  payments:
    # required, no default: "razorpay", or "mock" for development (refused with the prod profile)
    provider: ${PAYMENT_PROVIDER:}
    mock-secret: ${PAYMENT_MOCK_SECRET:mock-secret}
    pending-hold: ${PAYMENT_PENDING_HOLD:PT15M}
    reconcile-enabled: ${PAYMENT_RECONCILE_ENABLED:true}
    reconcile-interval: ${PAYMENT_RECONCILE_INTERVAL:PT5M}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  checkin:
    opens-before: ${CHECKIN_OPENS_BEFORE:PT6H}
    closes-after: ${CHECKIN_CLOSES_AFTER:PT12H}
  points:
    events-per-star: ${POINTS_EVENTS_PER_STAR:5}
