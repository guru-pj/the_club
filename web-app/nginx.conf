# The Club web app: serves the SPA and proxies /api to the gateway (same origin, so no CORS and the
# httpOnly refresh cookie just works).
#
# TLS: terminate HTTPS in front of this container (cloud load balancer, Caddy/Traefik/nginx on the host) and
# forward plain HTTP to it. If that proxy adds X-Forwarded-For, uncomment the real_ip lines below with its
# address range so rate limiting sees real client IPs instead of the proxy's.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 1m;

    # set_real_ip_from 10.0.0.0/8;       # address range of your load balancer / TLS proxy
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/problem+json;

    include /etc/nginx/snippets/security-headers.conf;

    # Liveness for the container healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API calls go to the gateway container
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The gateway trusts these (GATEWAY_TRUST_FORWARDED_FOR=true) for per-client rate limiting
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA shell
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# Keep the original scheme when TLS is terminated by a proxy in front of this container
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
