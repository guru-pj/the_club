# ============================================================
# The Club — production-like stack.
#
# Only the web app (WEB_APP_PORT) is published to the network; the gateway is published on 127.0.0.1 for host
# tooling (smoke tests). Databases, Eureka and the services are reachable only inside the compose network.
#
#   First time:  ./scripts/generate-secrets.sh && cp enviroinment_variables.env .env   (then edit .env)
#   Build:       mvn clean install -DskipTests
#   Production:  docker compose -f docker-compose.yml up -d --build
#   Development: docker compose up -d --build      (also loads docker-compose.override.yml: ports, Mailpit, Trino)
#
# Secrets are files in ./secrets, mounted read-only into only the containers that need them. Spring reads them
# through SPRING_CONFIG_IMPORT=optional:configtree:/run/secrets/ — each file is mounted under the name of the
# placeholder the service resolves (e.g. /run/secrets/JWT_PUBLIC_KEY for ${JWT_PUBLIC_KEY}).
# See docs/PRODUCTION.md.
# ============================================================

x-spring-env: &spring-env
  # (JAVA_TOOL_OPTIONS below) user.timezone: timestamps that entities set themselves (createdAt, ...) use the same
  # zone as the app's Clock, APP_TIME_ZONE; the container itself runs in UTC
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  SPRING_CONFIG_IMPORT: "optional:configtree:/run/secrets/"
  LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}
  APP_TIME_ZONE: ${APP_TIME_ZONE}
  EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
  JWT_EXPIRATION: ${JWT_EXPIRATION}
  JWT_KEY_ID: ${JWT_KEY_ID}
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Duser.timezone=${APP_TIME_ZONE}"

# Uploaded images (user-, club- and event-service): the bundled SeaweedFS S3 store, or any S3-compatible service
# when MEDIA_S3_ENDPOINT points elsewhere (see docs/PRODUCTION.md)
# An empty MEDIA_S3_ENDPOINT / MEDIA_S3_ACCESS_KEY in .env stays empty (AWS itself, GCS or Azure; the VM's own cloud
# identity), so these two use "-" rather than ":-"
x-media-env: &media-env
  MEDIA_PROVIDER: ${MEDIA_PROVIDER:-s3}
  MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT-http://seaweedfs:8333}
  MEDIA_PRIVATE_BUCKET: ${MEDIA_PRIVATE_BUCKET:-}
  MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-media}
  MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY-theclub-media}
  MEDIA_GCS_PROJECT_ID: ${MEDIA_GCS_PROJECT_ID:-}
  MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
  MEDIA_S3_PATH_STYLE: ${MEDIA_S3_PATH_STYLE:-true}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-/media}

x-spring-service: &spring-service
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 768M
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-depends-mysql: &depends-mysql
  discovery-service:
    condition: service_healthy
  mysql:
    condition: service_healthy

services:
  # ===================== DATABASES =====================
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
    secrets:
      - mysql-root-password
      - db-user-password
      - db-auth-password
      - db-club-password
      - db-event-password
      - db-notification-password
    volumes:
      - mysql_data:/var/lib/mysql
      # creates one database + least-privilege user per service on first start
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/mysql-root-password)\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: ${POSTGRES_ACTIVITY_DB}
    secrets:
      - postgres-password
      - db-activity-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # creates the activity-service role and hands it activitydb on first start
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_ACTIVITY_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  # ===================== BACKUPS =====================
  # Nightly dumps (BACKUP_SCHEDULE) into the 'backups' volume, kept BACKUP_RETENTION_DAYS. Each engine is dumped
  # with its own image so client and server versions always match. On demand: ./scripts/backup.sh
  db-backup-mysql:
    image: mysql:8.0
    container_name: db-backup-mysql
    restart: unless-stopped
    entrypoint: ["bash", "/opt/theclub/scripts/backup.sh", "schedule"]
    environment:
      BACKUP_ENGINE: mysql
      MYSQL_HOST: mysql
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      TZ: ${APP_TIME_ZONE}
    secrets:
      - mysql-root-password
    volumes:
      - backups:/backups
      - ./scripts:/opt/theclub/scripts:ro
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

  # Off-site copy of the dumps (recommended in production): `docker compose --profile offsite up -d`. Any rclone
  # target: S3, Google Cloud Storage, Azure Blob, another server. Set BACKUP_OFFSITE_TARGET (and the credentials
  # rclone needs, e.g. RCLONE_S3_ACCESS_KEY_ID / RCLONE_S3_SECRET_ACCESS_KEY) in .env. See docs/CLOUD_DEPLOYMENT.md.
  backup-offsite:
    image: rclone/rclone:1.70.3
    container_name: backup-offsite
    profiles: [offsite]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          rclone copy /backups "$$BACKUP_OFFSITE_TARGET" --min-age 2m --include "*.sql.gz" \
            && echo "[offsite $$(date -u +%FT%TZ)] dumps copied off-site" \
            || echo "[offsite $$(date -u +%FT%TZ)] ERROR: copying dumps failed"
          sleep $${BACKUP_OFFSITE_INTERVAL_SECONDS:-3600}
        done
    environment:
      HOME: /tmp
      BACKUP_OFFSITE_TARGET: ${BACKUP_OFFSITE_TARGET:-}
      BACKUP_OFFSITE_INTERVAL_SECONDS: ${BACKUP_OFFSITE_INTERVAL_SECONDS:-3600}
      RCLONE_S3_ACCESS_KEY_ID: ${RCLONE_S3_ACCESS_KEY_ID:-}
      RCLONE_S3_SECRET_ACCESS_KEY: ${RCLONE_S3_SECRET_ACCESS_KEY:-}
      RCLONE_AZUREBLOB_KEY: ${RCLONE_AZUREBLOB_KEY:-}
    volumes:
      - backups:/backups:ro
    logging: *logging

  db-backup-postgres:
    image: postgres:15
    container_name: db-backup-postgres
    restart: unless-stopped
    entrypoint: ["bash", "/opt/theclub/scripts/backup.sh", "schedule"]
    environment:
      BACKUP_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DATABASES: ${POSTGRES_ACTIVITY_DB}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      TZ: ${APP_TIME_ZONE}
    secrets:
      - postgres-password
    volumes:
      - backups:/backups
      - ./scripts:/opt/theclub/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

  # ===================== PLATFORM =====================
  discovery-service:
    <<: *spring-service
    build: ./discovery-service
    container_name: discovery-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Duser.timezone=${APP_TIME_ZONE}"
    deploy:
      resources:
        limits:
          memory: 512M

  config-service:
    <<: *spring-service
    build: ./config-service
    container_name: config-service
    environment:
      CONFIG_PROFILE: ${CONFIG_PROFILE}
      CONFIG_GIT_URI: ${CONFIG_GIT_URI}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Duser.timezone=${APP_TIME_ZONE}"
    deploy:
      resources:
        limits:
          memory: 512M

  gateway-service:
    <<: *spring-service
    build: ./gateway-service
    container_name: gateway-service
    ports:
      # host-local only: public traffic must come through the web app's nginx, which sets the client IP headers
      - "127.0.0.1:${GATEWAY_SERVICE_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      GATEWAY_TRUST_FORWARDED_FOR: "true"
      RATE_LIMIT_STRICT_PER_MINUTE: ${RATE_LIMIT_STRICT_PER_MINUTE}
      RATE_LIMIT_GENERAL_PER_MINUTE: ${RATE_LIMIT_GENERAL_PER_MINUTE}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Duser.timezone=${APP_TIME_ZONE}"
    depends_on:
      discovery-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ===================== DOMAIN SERVICES =====================
  user-service:
    <<: *spring-service
    build: ./user-service
    container_name: user-service
    environment:
      <<: [*spring-env, *media-env]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/userdb
      SPRING_DATASOURCE_USERNAME: theclub_user
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      APP_BASE_URL: ${APP_BASE_URL}
      ALLOW_DEV_PROFILE_ON_PUBLIC_URL: ${ALLOW_DEV_PROFILE_ON_PUBLIC_URL:-false}
    secrets:
      - source: jwt_public_key
        target: JWT_PUBLIC_KEY
      - source: internal_api_key
        target: INTERNAL_API_KEY
      - source: db-user-password
        target: SPRING_DATASOURCE_PASSWORD
      - source: media-s3-secret-key
        target: MEDIA_S3_SECRET_KEY
      - source: admin-password
        target: ADMIN_PASSWORD
    depends_on: *depends-mysql

  auth-service:
    <<: *spring-service
    build: ./auth-service
    container_name: auth-service
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/authdb
      SPRING_DATASOURCE_USERNAME: theclub_auth
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION}
    secrets:
      - source: jwt_public_key
        target: JWT_PUBLIC_KEY
      - source: jwt_private_key
        target: JWT_PRIVATE_KEY
      - source: internal_api_key
        target: INTERNAL_API_KEY
      - source: db-auth-password
        target: SPRING_DATASOURCE_PASSWORD
    depends_on: *depends-mysql

  activity-service:
    <<: *spring-service
    build: ./activity-service
    container_name: activity-service
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_ACTIVITY_DB}
      SPRING_DATASOURCE_USERNAME: theclub_activity
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI}
      STRAVA_WEBHOOK_VERIFY_TOKEN: ${STRAVA_WEBHOOK_VERIFY_TOKEN}
      STRAVA_WEBHOOK_CALLBACK_URL: ${STRAVA_WEBHOOK_CALLBACK_URL}
      STRAVA_INITIAL_SYNC_DAYS: ${STRAVA_INITIAL_SYNC_DAYS}
    secrets:
      - source: jwt_public_key
        target: JWT_PUBLIC_KEY
      - source: internal_api_key
        target: INTERNAL_API_KEY
      - source: db-activity-password
        target: SPRING_DATASOURCE_PASSWORD
      - source: strava-client-secret
        target: STRAVA_CLIENT_SECRET
      - source: strava-token-encryption-key
        target: STRAVA_TOKEN_ENCRYPTION_KEY
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy

  club-service:
    <<: *spring-service
    build: ./club-service
    container_name: club-service
    environment:
      <<: [*spring-env, *media-env]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/clubdb
      SPRING_DATASOURCE_USERNAME: theclub_club
    secrets:
      - source: jwt_public_key
        target: JWT_PUBLIC_KEY
      - source: internal_api_key
        target: INTERNAL_API_KEY
      - source: db-club-password
        target: SPRING_DATASOURCE_PASSWORD
      - source: media-s3-secret-key
        target: MEDIA_S3_SECRET_KEY
    depends_on: *depends-mysql

  event-service:
    <<: *spring-service
    build: ./event-service
    container_name: event-service
    environment:
      <<: [*spring-env, *media-env]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eventdb
      SPRING_DATASOURCE_USERNAME: theclub_event
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      EVENTS_DEFAULT_CURRENCY: ${EVENTS_DEFAULT_CURRENCY:-INR}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
    secrets:
      - source: jwt_public_key
        target: JWT_PUBLIC_KEY
      - source: internal_api_key
        target: INTERNAL_API_KEY
      - source: db-event-password
        target: SPRING_DATASOURCE_PASSWORD
      - source: media-s3-secret-key
        target: MEDIA_S3_SECRET_KEY
      - source: razorpay-key-secret
        target: RAZORPAY_KEY_SECRET
      - source: razorpay-webhook-secret
        target: RAZORPAY_WEBHOOK_SECRET
    depends_on: *depends-mysql

  notification-service:
    <<: *spring-service
    build: ./notification-service
    container_name: notification-service
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notificationdb
      SPRING_DATASOURCE_USERNAME: theclub_notification
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      MAIL_ENABLED: ${MAIL_ENABLED}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_REDIRECT_ALL_TO: ${MAIL_REDIRECT_ALL_TO:-}
      ZEPTOMAIL_API_URL: ${ZEPTOMAIL_API_URL:-https://api.zeptomail.in/v1.1/email}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_STARTTLS}
    secrets:
      - source: jwt_public_key
        target: JWT_PUBLIC_KEY
      - source: internal_api_key
        target: INTERNAL_API_KEY
      - source: db-notification-password
        target: SPRING_DATASOURCE_PASSWORD
      - source: smtp-password
        target: MAIL_PASSWORD
      - source: zeptomail-token
        target: ZEPTOMAIL_TOKEN
      - source: zeptomail-webhook-token
        target: ZEPTOMAIL_WEBHOOK_TOKEN
    depends_on: *depends-mysql

  # ===================== WEB APP =====================
  # S3-compatible store for uploaded images; nginx in web-app serves the "media" bucket read-only at /media/.
  # Only the services hold the key (secrets/media-s3-secret-key); anonymous access can read objects, never write.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs
    restart: unless-stopped
    command: ["server", "-s3", "-s3.config=/run/secrets/seaweedfs-s3.json", "-dir=/data", "-volume.max=10"]
    volumes:
      - media_data:/data
    secrets:
      - seaweedfs-s3.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  web-app:
    build: ./web-app
    container_name: web-app
    restart: unless-stopped
    ports:
      - "${WEB_APP_PORT}:8080"
    environment:
      # Proxy address ranges whose X-Forwarded-For is trusted (e.g. Caddy on this host: 172.16.0.0/12)
      REAL_IP_FROM: ${REAL_IP_FROM:-}
    depends_on:
      gateway-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging

secrets:
  media-s3-secret-key:
    file: ./secrets/media-s3-secret-key
  seaweedfs-s3.json:
    file: ./secrets/seaweedfs-s3.json
  jwt_public_key:
    file: ./secrets/theclub.jwt.public-key
  jwt_private_key:
    file: ./secrets/theclub.jwt.private-key
  internal_api_key:
    file: ./secrets/theclub.security.internal-api-key
  mysql-root-password:
    file: ./secrets/mysql-root-password
  postgres-password:
    file: ./secrets/postgres-password
  db-user-password:
    file: ./secrets/db-user-password
  db-auth-password:
    file: ./secrets/db-auth-password
  db-club-password:
    file: ./secrets/db-club-password
  db-event-password:
    file: ./secrets/db-event-password
  db-notification-password:
    file: ./secrets/db-notification-password
  db-activity-password:
    file: ./secrets/db-activity-password
  admin-password:
    file: ./secrets/admin-password
  smtp-password:
    file: ./secrets/smtp-password
  zeptomail-token:
    file: ./secrets/zeptomail-token
  zeptomail-webhook-token:
    file: ./secrets/zeptomail-webhook-token
  razorpay-key-secret:
    file: ./secrets/razorpay-key-secret
  razorpay-webhook-secret:
    file: ./secrets/razorpay-webhook-secret
  strava-client-secret:
    file: ./secrets/strava-client-secret
  strava-token-encryption-key:
    file: ./secrets/strava-token-encryption-key

volumes:
  media_data:
  mysql_data:
  postgres_data:
  backups:
