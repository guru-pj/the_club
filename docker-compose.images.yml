  club-service:
    build: !reset null
    image: ${IMAGE_REGISTRY:-ghcr.io/guru-pj}/the-club-club-service:${IMAGE_TAG:?set IMAGE_TAG to the git sha published by CI}
    pull_policy: always
  event-service:
    build: !reset null
    image: ${IMAGE_REGISTRY:-ghcr.io/guru-pj}/the-club-event-service:${IMAGE_TAG:?set IMAGE_TAG to the git sha published by CI}
    pull_policy: always
  notification-service:
    build: !reset null
    image: ${IMAGE_REGISTRY:-ghcr.io/guru-pj}/the-club-notification-service:${IMAGE_TAG:?set IMAGE_TAG to the git sha published by CI}
    pull_policy: always
  web-app:
    build: !reset null
    image: ${IMAGE_REGISTRY:-ghcr.io/guru-pj}/the-club-web-app:${IMAGE_TAG:?set IMAGE_TAG to the git sha published by CI}
    pull_policy: always
