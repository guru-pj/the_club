<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="button(href, label)">
  <p style="margin:24px 0;">
    <a th:href="${href}" style="display:inline-block;padding:12px 22px;background:#0f766e;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:600;" th:text="${label}">Open</a>
  </p>
  <p style="color:#5f6b65;font-size:13px;word-break:break-all;">Or paste this link into your browser:<br><span th:text="${href}">link</span></p>
</div>
</body>
</html>
