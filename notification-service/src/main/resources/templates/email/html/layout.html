<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title th:text="${title}">The Club</title>
</head>
<body style="margin:0;padding:0;background:#f6f7f5;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#17201c;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f7f5;padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e5e0;border-radius:12px;">
        <tr>
          <td style="padding:20px 28px;border-bottom:1px solid #e2e5e0;">
            <span style="display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:7px;background:#0f766e;color:#ffffff;font-weight:700;">&#9679;</span>
            <span style="font-size:18px;font-weight:700;vertical-align:middle;margin-left:8px;color:#17201c;">The Club</span>
          </td>
        </tr>
        <tr>
          <td style="padding:28px;font-size:15px;line-height:1.6;">
            <div th:replace="${content}">Email content</div>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px;border-top:1px solid #e2e5e0;color:#5f6b65;font-size:12px;line-height:1.5;">
            You received this email because <span th:text="${footerReason}">you have an account at The Club.</span><br>
            This is an automated message from The Club &mdash; please don't reply to it.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
