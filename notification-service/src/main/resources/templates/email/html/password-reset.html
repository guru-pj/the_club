<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{html/layout :: layout('Reset your password', ~{::#content})}">
<body>
<div id="content">
        <h1 style="font-size:22px;margin:0 0 16px;">Reset your password</h1>
        <p>Hi <span th:text="${name}">there</span>,</p>
        <p>We received a request to reset your password. Choose a new one using the button below.</p>
        <th:block th:replace="~{html/parts :: button(${link}, 'Reset password')}"></th:block>
        <p>This link expires in 30 minutes and can be used once. If you didn't ask for this, you can ignore this email &mdash; your password stays the same.</p>
</div>
</body>
</html>
