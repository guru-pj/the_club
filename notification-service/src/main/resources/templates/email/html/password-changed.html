<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{html/layout :: layout('Your password was changed', ~{::#content})}">
<body>
<div id="content">
        <h1 style="font-size:22px;margin:0 0 16px;">Your password was changed</h1>
        <p>Hi <span th:text="${name}">there</span>,</p>
        <p>Your password was just changed and you were signed out on all devices.</p>
        <p><strong>If this wasn't you</strong>, reset your password immediately using &ldquo;Forgot password?&rdquo; on the login page, and contact the club admins.</p>
</div>
</body>
</html>
