server:
  port: 8087

spring:
  jackson:
    # Spring Boot 4 uses Jackson 3, whose defaults differ (e.g. missing primitive fields are rejected); keep the
    # behaviour clients relied on with Jackson 2
    use-jackson2-defaults: true
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/notificationdb?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Databases created earlier by Hibernate's ddl-auto=update have no Flyway history table. They are adopted
    # as version 1 (the baseline) without re-running V1__baseline.sql; later migrations then apply normally.
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    # See newly started services within seconds instead of ~30s (avoids 503s right after a restart)
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

# The load balancer's own instance cache would otherwise add another 35s of delay
spring.cloud.loadbalancer.cache.ttl: 5s

management:
  endpoints:
    web:
      exposure:
        # /actuator is never reachable from outside: nginx proxies only /api and the gateway never routes /actuator.
        # Prometheus scrapes /actuator/prometheus over the internal network.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # /actuator/health/liveness and /actuator/health/readiness for Docker and Kubernetes probes
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s
  tracing:
    # Spans are exported only where an OpenTelemetry collector runs (docker-compose.observability.yml, Helm chart)
    export:
      enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  # Spring Boot 4 names (management.tracing.enabled / management.otlp.tracing.endpoint are no longer read)
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  # Keep the service healthy when SMTP is down: email is best-effort.
  health:
    mail:
      enabled: false

theclub:
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
    previous-public-key: ${JWT_PREVIOUS_PUBLIC_KEY:}
    key-id: ${JWT_KEY_ID:k1}
    expiration: ${JWT_EXPIRATION:PT15M}
  security:
    internal-api-key: ${INTERNAL_API_KEY}
    public-paths:
      # ZeptoMail bounce webhook; authenticated by the ZEPTOMAIL_WEBHOOK_TOKEN shared secret
      - /api/v1/notifications/webhooks/zeptomail
  mail:
    # zeptomail | smtp | log. Blank = legacy behaviour: MAIL_ENABLED=true -> smtp, false -> log. See docs/EMAIL_SETUP.md
    provider: ${MAIL_PROVIDER:}
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:The Club <no-reply@theclub.local>}
    reply-to: ${MAIL_REPLY_TO:}
    # Staging safety net: deliver every email to this one address instead of the real recipient
    redirect-all-to: ${MAIL_REDIRECT_ALL_TO:}
    zeptomail:
      api-url: ${ZEPTOMAIL_API_URL:https://api.zeptomail.in/v1.1/email}
      token: ${ZEPTOMAIL_TOKEN:}
      connect-timeout: 5s
      read-timeout: 15s
    dispatcher:
      enabled: ${MAIL_DISPATCHER_ENABLED:true}
      interval: ${MAIL_DISPATCHER_INTERVAL:PT5S}
      batch-size: 20
      max-attempts: 8
      stuck-after: PT10M
    webhook:
      token: ${ZEPTOMAIL_WEBHOOK_TOKEN:}

# --- Operations: graceful shutdown on SIGTERM (rolling deploys), connection pool, outbound timeouts ---
# Logs are plain text locally; set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON (the observability stack does).
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
spring.datasource.hikari.maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout: 5000
