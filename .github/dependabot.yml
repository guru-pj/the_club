# Weekly dependency updates; minor/patch bumps are grouped to keep PR noise down.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Spring Cloud 2025.1 is built against Spring Boot 4.0; move to Boot 4.1 together with the Spring Cloud release
      # train that supports it, by hand
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/web-app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Node's type definitions follow the Node version the app is built with (22, as in CI and the Dockerfile)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/discovery-service"
      - "/config-service"
      - "/gateway-service"
      - "/user-service"
      - "/auth-service"
      - "/activity-service"
      - "/club-service"
      - "/event-service"
      - "/notification-service"
      - "/web-app"
    schedule:
      interval: weekly
    ignore:
      # Major versions of Java and Node change the runtime; move between LTS releases deliberately (Java 21 -> 25,
      # Node 22 -> 24) instead of to whatever is newest
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]

  # Images used directly by the Compose files (databases, backup, storage, observability)
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # A database major upgrade needs a dump and restore; do it deliberately
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]
