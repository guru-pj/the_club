# Weekly dependency updates; minor/patch bumps are grouped to keep PR noise down.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/web-app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/discovery-service"
      - "/config-service"
      - "/gateway-service"
      - "/user-service"
      - "/auth-service"
      - "/activity-service"
      - "/club-service"
      - "/event-service"
      - "/notification-service"
      - "/web-app"
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
