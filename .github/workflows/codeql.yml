name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Code scanning (the Security tab) isn't available for private personal repositories, so results go to the job
    # summary and a SARIF artifact instead, and the job fails when there are any
    permissions:
      contents: read
      # the CodeQL action reads its own workflow run even when it doesn't upload
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build
        if: matrix.build-mode == 'manual'
        run: mvn -B -ntp -DskipTests package

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: sarif-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report findings
        run: |
          count=$(jq -s '[.[].runs[].results[]] | length' sarif-results/*.sarif)
          {
            echo "### CodeQL (${{ matrix.language }}): $count findings"
            if [ "$count" -gt 0 ]; then
              echo; echo "| Rule | Location | Message |"; echo "|---|---|---|"
              jq -r '.runs[].results[] | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) | \(.message.text | split("\n")[0] | gsub("\\|"; "/")) |"' sarif-results/*.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then echo "::error::CodeQL found $count issues; see the job summary"; exit 1; fi
