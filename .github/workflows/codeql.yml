name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Code scanning (the Security tab) isn't available for private personal repositories, so results go to the job
    # summary and a SARIF artifact instead, and the job fails when there are any
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build
        if: matrix.build-mode == 'manual'
        run: mvn -B -ntp -DskipTests package

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: sarif-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report findings
        run: |
          count=$(jq -s '[.[].runs[].results[]] | length' sarif-results/*.sarif)
          {
            echo "### CodeQL (${{ matrix.language }}): $count findings"
            if [ "$count" -gt 0 ]; then
              echo; echo "| Rule | Location | Message |"; echo "|---|---|---|"
              jq -r '.runs[].results[] | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) | \(.message.text | split("\n")[0] | gsub("\\|"; "/")) |"' sarif-results/*.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then echo "::error::CodeQL found $count issues; see the job summary"; exit 1; fi
