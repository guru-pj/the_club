name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test all modules
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

  web:
    name: Web app (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx oxlint src
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  helm:
    name: Helm chart (lint, render, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Chart copies of the database init and backup scripts are up to date
        run: |
          diff docker/mysql/initdb/01-service-users.sh deploy/helm/the-club/files/mysql-01-service-users.sh
          diff docker/postgres/initdb/01-service-user.sh deploy/helm/the-club/files/postgres-01-service-user.sh
          diff scripts/backup.sh deploy/helm/the-club/files/backup.sh
      - name: Lint and validate (defaults, dev, prod)
        run: |
          chart=deploy/helm/the-club
          for values in "" "-f $chart/values-dev.yaml" "-f $chart/values-prod.yaml"; do
            helm lint --strict $chart $values
            helm template the-club $chart -n the-club $values \
              | kubeconform -strict -summary -kubernetes-version 1.30.0 \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  images:
    name: Image ${{ matrix.service }}
    # Publish only from main, after everything is green
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-service
          - config-service
          - gateway-service
          - user-service
          - auth-service
          - activity-service
          - club-service
          - event-service
          - notification-service
          - web-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        if: matrix.service != 'web-app'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        if: matrix.service != 'web-app'
        run: mvn -B -ntp -DskipTests -pl ${{ matrix.service }} -am package

      - name: Image name
        run: |
          owner="${{ github.repository_owner }}"
          echo "IMAGE=ghcr.io/${owner,,}/the-club-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image (fail on fixable CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  dependency-scan:
    # Code scanning (the Security tab) isn't available for private personal repositories, so findings go to the job
    # summary and a SARIF artifact instead, and the job fails when there are any
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan lockfiles and poms
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          retention-days: 14
      - name: Report findings
        run: |
          count=$(jq '[.runs[].results[]] | length' trivy-fs.sarif)
          {
            echo "### Dependency scan: $count HIGH/CRITICAL fixable vulnerabilities"
            if [ "$count" -gt 0 ]; then
              echo; echo "| Rule | File | Details |"; echo "|---|---|---|"
              jq -r '.runs[].results[] | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.message.text | split("\n") | map(select(test("Package|Installed|Fixed|Severity"))) | join("; ")) |"' trivy-fs.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then echo "::error::$count fixable HIGH/CRITICAL vulnerabilities; see the job summary"; exit 1; fi
