name: Native apps

# Builds the Android APK and iOS app (Capacitor) and the macOS app (Tauri) from web-app/. Both bundle the UI and call the
# gateway at APP_API_BASE_URL, so set that repository variable (Settings → Secrets and variables → Actions →
# Variables), e.g. https://club.example.com. APP_WEB_URL (optional) is shown where a flow must finish on the website.
#
# Pushing a tag app-vX.Y.Z publishes a GitHub Release with TheClub-android.apk and TheClub-macos.dmg, also
# reachable at …/releases/latest/download/<file>, and uploads the iOS app to TestFlight when the App Store Connect
# secrets are set. Other runs only upload workflow artifacts (test builds; iOS as a Simulator build).
# Step-by-step guide: docs/NATIVE_APPS.md
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Gateway URL the apps call (defaults to the APP_API_BASE_URL variable)"
        required: false
      web_app_url:
        description: "Website URL (defaults to the APP_WEB_URL variable)"
        required: false
  push:
    branches: [main]
    tags: ["app-v*"]
    paths:
      - "web-app/**"
      - ".github/workflows/apps.yml"

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.APP_API_BASE_URL }}
  VITE_WEB_APP_URL: ${{ inputs.web_app_url || vars.APP_WEB_URL }}
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/app-v') }}
  # Android needs an ever-increasing versionCode for updates; the run number only grows
  APP_VERSION_CODE: ${{ github.run_number }}

jobs:
  version:
    name: Version
    if: inputs.api_base_url != '' || vars.APP_API_BASE_URL != ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "$IS_RELEASE" = true ]; then
            version="${GITHUB_REF_NAME#app-v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must look like app-v1.2.3 (got $GITHUB_REF_NAME)"; exit 1
            fi
          else
            version="0.0.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version (versionCode $APP_VERSION_CODE)"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - name: Build UI and sync it into the Android project
        run: npm run android:sync
      - name: Build APK
        working-directory: web-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/TheClub-android.apk"
          elif [ "$IS_RELEASE" = true ]; then
            echo "::error::Releases must be signed with the permanent keystore: add the ANDROID_KEYSTORE_* secrets (docs/NATIVE_APPS.md)"
            exit 1
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this test build is debug-signed and can't update a release install"
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/TheClub-android.apk"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: the-club-android
          path: ${{ runner.temp }}/TheClub-android.apk
          retention-days: 14

  macos:
    name: macOS app
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-app/src-tauri
      - run: npm ci
      - name: Build universal app and disk image (Apple Silicon + Intel)
        run: |
          npx tauri build --target universal-apple-darwin --config '{"version":"${{ needs.version.outputs.version }}"}'
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "$RUNNER_TEMP/TheClub-macos.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: the-club-macos
          path: ${{ runner.temp }}/TheClub-macos.dmg
          retention-days: 14

  ios:
    name: iOS app
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - name: Build UI and sync it into the iOS project
        run: npm run ios:sync
      - name: Build for the iOS Simulator (unsigned)
        working-directory: web-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_VERSION_CODE" build
          cd "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator"
          zip -qry "$RUNNER_TEMP/TheClub-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v7
        with:
          name: the-club-ios-simulator
          path: ${{ runner.temp }}/TheClub-ios-simulator.zip
          retention-days: 14
      # iPhones only install apps signed by Apple, so releases go to TestFlight instead of the GitHub Release
      - name: Sign and upload to TestFlight
        if: env.IS_RELEASE == 'true'
        working-directory: web-app/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::No App Store Connect secrets: the iOS build was not uploaded to TestFlight (docs/NATIVE_APPS.md)"
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
          # Xcode creates the certificates and profiles itself through the App Store Connect API key
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/TheClub.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_VERSION_CODE" \
            "${auth[@]}" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TheClub.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          echo "Uploaded build $APP_VERSION ($APP_VERSION_CODE). It appears in TestFlight after Apple finishes processing."

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [version, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd out
          sha256sum TheClub-android.apk TheClub-macos.dmg > SHA256SUMS.txt
          cat > notes.md <<EOF
          ## The Club ${VERSION}

          | | Download | Requires |
          |---|---|---|
          | Android | [TheClub-android.apk](${REPO_URL}/releases/download/${GITHUB_REF_NAME}/TheClub-android.apk) | Android 7.0 or later |
          | macOS | [TheClub-macos.dmg](${REPO_URL}/releases/download/${GITHUB_REF_NAME}/TheClub-macos.dmg) | macOS 13 or later, Apple Silicon or Intel |

          iPhone and iPad: install **The Club** from TestFlight (ask a club admin for an invite).

          Always-current links: \`${REPO_URL}/releases/latest/download/TheClub-android.apk\` and \`…/TheClub-macos.dmg\`.

          How to install: [docs/NATIVE_APPS.md](${REPO_URL}/blob/${GITHUB_REF_NAME}/docs/NATIVE_APPS.md#installing-on-android).
          EOF
          gh release create "$GITHUB_REF_NAME" TheClub-android.apk TheClub-macos.dmg SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "The Club $VERSION" --notes-file notes.md
