server:
  port: 8888

spring:
  application:
    name: config-service
  profiles:
    # "native" serves the bundled config-repo; set SPRING_PROFILES_ACTIVE=git and CONFIG_GIT_URI to use a git repo
    active: ${CONFIG_PROFILE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_NATIVE_LOCATIONS:classpath:/config-repo}
        git:
          uri: ${CONFIG_GIT_URI:}
          clone-on-start: true
          default-label: ${CONFIG_GIT_LABEL:main}

management:
  endpoints:
    web:
      exposure:
        # /actuator is never reachable from outside: nginx proxies only /api and the gateway never routes /actuator.
        # Prometheus scrapes /actuator/prometheus over the internal network.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # /actuator/health/liveness and /actuator/health/readiness for Docker and Kubernetes probes
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s

# --- Operations: graceful shutdown on SIGTERM (rolling deploys), connection pool, outbound timeouts ---
# Logs are plain text locally; set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON (the observability stack does).
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
